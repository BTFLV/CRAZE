name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Runs for the same ref are queued, never cancelled, so a publish is never interrupted halfway.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: test

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: svelte-check
        working-directory: app
        run: npm run check

      # Tauri's generate_context! needs app/dist, otherwise the workspace does not compile.
      - name: Build frontend
        working-directory: app
        run: npm run build

      - name: cargo test
        run: cargo test --workspace

  build:
    name: Build (${{ matrix.name }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            platform: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin
          - name: Windows
            platform: windows-latest
            rust-targets: ""
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: build-${{ matrix.platform }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      # Signing secrets are exported only when they are set. Defining them as empty strings
      # would still make the Tauri bundler attempt to sign and fail the build.
      - name: Configure macOS signing
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          status="unsigned (ad-hoc signature)"
          if [ -n "$APPLE_CERTIFICATE" ] && [ -n "$APPLE_SIGNING_IDENTITY" ]; then
            {
              echo "APPLE_CERTIFICATE=$APPLE_CERTIFICATE"
              echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD"
              echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY"
            } >> "$GITHUB_ENV"
            status="signed, not notarized"
            if [ -n "$APPLE_ID" ] && [ -n "$APPLE_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
              {
                echo "APPLE_ID=$APPLE_ID"
                echo "APPLE_PASSWORD=$APPLE_PASSWORD"
                echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
              } >> "$GITHUB_ENV"
              status="signed and notarized (Apple ID)"
            elif [ -n "$APPLE_API_KEY" ] && [ -n "$APPLE_API_ISSUER" ] && [ -n "$APPLE_API_KEY_P8" ]; then
              key_path="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY.p8"
              printf '%s\n' "$APPLE_API_KEY_P8" > "$key_path"
              {
                echo "APPLE_API_KEY=$APPLE_API_KEY"
                echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"
                echo "APPLE_API_KEY_PATH=$key_path"
              } >> "$GITHUB_ENV"
              status="signed and notarized (App Store Connect API key)"
            fi
          else
            # Without a certificate the app is signed ad hoc ("-"). Universal binaries need a
            # valid signature to launch at all; users still have to confirm the first start.
            config="$RUNNER_TEMP/tauri.signing.json"
            echo '{"bundle":{"macOS":{"signingIdentity":"-"}}}' > "$config"
            echo "TAURI_EXTRA_ARGS=--config $config" >> "$GITHUB_ENV"
          fi
          echo "SIGNING_STATUS=$status" >> "$GITHUB_ENV"
          echo "::notice title=macOS signing::$status"

      - name: Configure Windows signing
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
        run: |
          $status = "unsigned"
          if ($env:WINDOWS_CERTIFICATE) {
            $pfx = Join-Path $env:RUNNER_TEMP "certificate.pfx"
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
            $password = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
            $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
            Remove-Item $pfx
            $timestamp = if ($env:WINDOWS_TIMESTAMP_URL) { $env:WINDOWS_TIMESTAMP_URL } else { "http://timestamp.digicert.com" }
            $config = Join-Path $env:RUNNER_TEMP "tauri.signing.json"
            @{ bundle = @{ windows = @{
              certificateThumbprint = $cert.Thumbprint
              digestAlgorithm = "sha256"
              timestampUrl = $timestamp
            } } } | ConvertTo-Json -Depth 5 | Set-Content -Path $config -Encoding utf8
            "TAURI_EXTRA_ARGS=--config $config" >> $env:GITHUB_ENV
            $status = "signed (certificate $($cert.Thumbprint))"
          }
          "SIGNING_STATUS=$status" >> $env:GITHUB_ENV
          Write-Output "::notice title=Windows signing::$status"

      - name: Build app
        uses: tauri-apps/tauri-action@v1
        with:
          projectPath: app
          args: ${{ matrix.args }} ${{ env.TAURI_EXTRA_ARGS }}

      - name: Collect macOS bundle
        if: runner.os == 'macOS'
        run: |
          bundle=target/universal-apple-darwin/release/bundle
          mkdir -p dist
          cp "$(ls $bundle/dmg/*.dmg | head -n1)" dist/CRAZE-macOS-universal.dmg
          echo "Signature of CRAZE.app:"
          codesign -dv --verbose=2 "$bundle/macos/CRAZE.app" 2>&1 | grep -E "Authority|Signature|TeamIdentifier" || true
          spctl -a -vv "$bundle/macos/CRAZE.app" 2>&1 || echo "Gatekeeper rejects the app (expected for unsigned builds)."
          echo "macOS: $SIGNING_STATUS" > dist/signing-macos.txt

      - name: Collect Windows bundles
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bundle = "target/release/bundle"
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item (Get-ChildItem "$bundle/nsis/*-setup.exe" | Select-Object -First 1) dist/CRAZE-Windows-x64-setup.exe
          Copy-Item (Get-ChildItem "$bundle/msi/*.msi" | Select-Object -First 1) dist/CRAZE-Windows-x64.msi
          Get-ChildItem dist/*.exe, dist/*.msi | ForEach-Object {
            $sig = Get-AuthenticodeSignature $_.FullName
            Write-Output "$($_.Name): $($sig.Status) $($sig.SignerCertificate.Subject)"
          }
          "Windows: $env:SIGNING_STATUS" | Set-Content dist/signing-windows.txt

      - uses: actions/upload-artifact@v7
        with:
          name: craze-${{ matrix.name }}
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish rolling release
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: latest
      TITLE: Latest CRAZE Release
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Write release notes
        run: |
          date=$(gh api "repos/$GH_REPO/commits/$GITHUB_SHA" --jq '.commit.committer.date')
          subject=$(gh api "repos/$GH_REPO/commits/$GITHUB_SHA" --jq '.commit.message | split("\n")[0]')
          {
            echo "Automatic build of the \`main\` branch. This release is replaced on every push."
            echo
            echo "- Commit: [\`${GITHUB_SHA::7}\`](https://github.com/$GH_REPO/commit/$GITHUB_SHA) $subject"
            echo "- Commit date: $date"
            echo "- Built: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo "| Platform | File |"
            echo "| --- | --- |"
            echo "| macOS (Apple Silicon and Intel) | \`CRAZE-macOS-universal.dmg\` |"
            echo "| Windows 10/11 x64, installer | \`CRAZE-Windows-x64-setup.exe\` |"
            echo "| Windows 10/11 x64, MSI | \`CRAZE-Windows-x64.msi\` |"
            echo
            echo "Code signing:"
            echo
            for f in artifacts/signing-*.txt; do echo "- $(cat "$f")"; done
            echo
            echo "Unsigned builds trigger a warning on first start; see the README for how to open them."
          } > notes.md
          rm artifacts/signing-*.txt
          cat notes.md

      - name: Move tag to this commit
        run: |
          if gh api "repos/$GH_REPO/git/refs/tags/$TAG" > /dev/null 2>&1; then
            gh api -X PATCH "repos/$GH_REPO/git/refs/tags/$TAG" -f sha="$GITHUB_SHA" -F force=true > /dev/null
          else
            gh api -X POST "repos/$GH_REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" > /dev/null
          fi

      - name: Create or update release
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --notes-file notes.md --draft=false --prerelease=false --latest
          else
            gh release create "$TAG" --title "$TITLE" --notes-file notes.md --latest --verify-tag
          fi

      - name: Replace assets
        run: |
          gh release upload "$TAG" artifacts/* --clobber
          # Remove assets from earlier builds that are not part of this one.
          keep=$(ls artifacts)
          gh release view "$TAG" --json assets --jq '.assets[].name' | while read -r name; do
            if ! grep -qxF "$name" <<< "$keep"; then
              gh release delete-asset "$TAG" "$name" --yes
            fi
          done
          gh release view "$TAG"
