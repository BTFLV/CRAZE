[workspace]
resolver = "3"
members = ["crates/craze-core", "crates/craze-cli", "app/src-tauri", "crates/craze-devbridge"]

[workspace.package]
version = "2.0.0"
edition = "2024"
license = "MIT"
authors = ["Philip Mohr"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1
