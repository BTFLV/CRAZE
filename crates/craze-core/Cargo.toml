[package]
name = "craze-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "GDSII import, rasterization and resistor-network solver for 2D thin-film resistance simulation"

[dependencies]
faer = { version = "0.24.4", default-features = false, features = ["std", "rayon", "sparse-linalg"] }
i_overlay = "9.0.1"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
